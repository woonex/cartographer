services:

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ingestion:
    build: ./src/services/ingestion
    ports:
      - "8001:8001"
    environment:
      - INGESTION_VECTOR_STORE_URL=http://qdrant:6333
    depends_on:
      - qdrant

volumes:
  qdrant_data:
