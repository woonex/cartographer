[project]
name = "cartographer"
version = "0.1.0"
description = "A chatbot for vehicle owners using RAG over owner's manuals"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn",
    "python-multipart",
    "torch",
    "sentence-transformers",
    "langchain-text-splitters",
    "pymupdf",
    "qdrant-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
